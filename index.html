<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progression BMX Timing</title>

  <style>
    :root {
      --bg: #0b1624;
      --text-primary: #ffffff;
      --text-secondary: #9fb2c8;
      --accent: #6bbf59;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #12233a, var(--bg));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 720px;
    }

   .logo {
  display: block;
  max-width: 720px;
  width: 100%;
  height: auto;
  margin: 0 auto 2.5rem auto;
    }

    .tracks-title {
      margin: 0 0 1.25rem;
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 500;
    }

    .track-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      width: min(100%, 300px);
      margin: 0 auto;
      padding: 1.5rem;
      border: 1px solid #43546b;
      border-radius: 20px;
      background: #ffffff;
      color: #111820;
      text-decoration: none;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .track-link:hover {
      border-color: #66c24f;
      box-shadow: 0 0 0 3px #66c24f;
    }

    .track-link:focus-visible {
      outline: 3px solid #66c24f;
      outline-offset: 5px;
    }

    .track-badge {
      display: block;
      width: 100%;
      max-width: 210px;
      height: auto;
    }

    .track-name { font-size: 1.2rem; }
    .track-action { font-size: 0.95rem; color: #334155; }

  </style>
</head>
<body>

  <div class="container">
    <img
      src="/wide logo .png"
      alt="Progression BMX Timing"
      class="logo"
    />

    <h1 class="tracks-title">Find your track</h1>
    <a class="track-link" href="/MLBMX.html" aria-label="Moses Lake BMX — view track results">
      <img src="/moses-lake-bmx-badge.png" alt="Moses Lake BMX" class="track-badge" width="1332" height="1600" />
      <strong class="track-name">Moses Lake BMX</strong>
      <span class="track-action">View track results &rarr;</span>
    </a>
  </div>

</body>
</html>
